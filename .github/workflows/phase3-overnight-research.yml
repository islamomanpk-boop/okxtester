name: Phase 3 Overnight Research Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-overnight-research
  cancel-in-progress: false

jobs:
  read-only-preflight:
    name: Read-only Phase 3 preflight and recovery index
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the research branch
        uses: actions/checkout@v4
        with:
          ref: price-action-v1
          fetch-depth: 1

      - name: Record exact research revision
        shell: bash
        run: echo "PHASE3_RESEARCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned analysis dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3

      - name: Check worker syntax
        run: python -m py_compile research/phase3_overnight_worker_v1.py

      - name: Run read-only integrity preflight and gate index
        run: python research/phase3_overnight_worker_v1.py

      - name: Always preserve the recovery index and audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-overnight
          path: phase3_overnight_output/
          if-no-files-found: warn
          retention-days: 14
