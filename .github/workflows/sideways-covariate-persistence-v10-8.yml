name: Phase 3 V10.8 Covariate Imbalance Persistence
on:
  workflow_dispatch:
  push:
    branches: [price-action-v1]
    paths:
      - .github/workflows/sideways-covariate-persistence-v10-8.yml
      - research/sideways_rejection_pre_event_matched_controls_v10_8.py
      - tests/test_sideways_rejection_pre_event_matched_controls_v10_8.py
permissions:
  contents: write
concurrency:
  group: sideways-covariate-persistence-v10-8
  cancel-in-progress: false
jobs:
  audit-v10-8:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: price-action-v1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas
      - name: Compile and test
        run: |
          python -m py_compile research/sideways_rejection_pre_event_matched_controls_v10_8.py tests/test_sideways_rejection_pre_event_matched_controls_v10_8.py
          python -m unittest discover -s tests -p 'test_sideways_rejection_pre_event_matched_controls_v10_8.py' -v
      - name: Verify frozen V10.7 input
        run: test -s reports/sideways_phase3_research_archive_v1/minimum_subgroup_size_sensitivity_v10_7/minimum_sample_sensitivity_detail_v10_7.csv
      - name: Run persistence diagnostic
        run: |
          python research/sideways_rejection_pre_event_matched_controls_v10_8.py \
            --input reports/sideways_phase3_research_archive_v1/minimum_subgroup_size_sensitivity_v10_7/minimum_sample_sensitivity_detail_v10_7.csv \
            --output "$RUNNER_TEMP/sideways_covariate_persistence_v10_8"
      - name: Permanently archive with retry-safe push
        run: |
          archive=reports/sideways_phase3_research_archive_v1/covariate_imbalance_persistence_v10_8
          mkdir -p "$archive"
          cp -R "$RUNNER_TEMP/sideways_covariate_persistence_v10_8/." "$archive/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$archive"
          if ! git diff --cached --quiet; then
            git commit -m "Archive Phase 3 V10.8 covariate imbalance persistence"
            for attempt in 1 2 3; do
              git pull --rebase origin price-action-v1
              if git push origin HEAD:price-action-v1; then exit 0; fi
              sleep 2
            done
            echo "Archive push failed after retries" >&2
            exit 1
          fi
      - name: Upload secondary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sideways-covariate-persistence-v10-8
          path: ${{ runner.temp }}/sideways_covariate_persistence_v10_8/
          if-no-files-found: error
          retention-days: 14
