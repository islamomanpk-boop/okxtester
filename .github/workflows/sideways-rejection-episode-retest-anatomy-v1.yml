name: Sideways Rejection Episode, Retest, and Early-Path Historical Studies V1

on:
  workflow_dispatch:
  push:
    branches:
      - price-action-v1
    paths:
      - .github/workflows/sideways-rejection-episode-retest-anatomy-v1.yml

permissions:
  contents: write

concurrency:
  group: sideways-rejection-episode-retest-anatomy-v1
  cancel-in-progress: false

jobs:
  historical-study:
    name: Test and run five-asset rejection anatomy and follow-through studies
    runs-on: ubuntu-latest
    timeout-minutes: 36

    steps:
      - name: Check out price-action-v1
        uses: actions/checkout@v4
        with:
          ref: price-action-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip numpy pandas

      - name: Compile research modules and tests
        run: |
          python -m py_compile \
            research/sideways_rejection_forward_outcomes_v1.py \
            research/sideways_rejection_episode_retest_anatomy_v1.py \
            research/sideways_rejection_early_path_sequence_followthrough_v1.py \
            research/sideways_rejection_sequence_block_bootstrap_v1.py \
            research/sideways_rejection_pre_event_matched_controls_v1.py \
            research/sideways_rejection_pre_event_matched_controls_v2.py \
            tests/test_sideways_rejection_forward_outcomes_v1.py \
            tests/test_sideways_rejection_episode_retest_anatomy_v1.py \
            tests/test_sideways_rejection_early_path_sequence_followthrough_v1.py \
            tests/test_sideways_rejection_sequence_block_bootstrap_v1.py \
            tests/test_sideways_rejection_pre_event_matched_controls_v1.py \
            tests/test_sideways_rejection_pre_event_matched_controls_v2.py
      - name: Run existing rejection forward-outcome tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_sideways_rejection_forward_outcomes_v1.py' \
            -v

      - name: Run episode/retest anatomy synthetic tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_sideways_rejection_episode_retest_anatomy_v1.py' \
            -v

      - name: Run early-path sequence follow-through tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_sideways_rejection_early_path_sequence_followthrough_v1.py' \
            -v

      - name: Run calendar moving-block bootstrap synthetic tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_sideways_rejection_sequence_block_bootstrap_v1.py' \
            -v

      - name: Run pre-event matched-control synthetic tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_sideways_rejection_pre_event_matched_controls_v1.py' \
            -v

      - name: Run stricter pre-event matched-control V2 tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_sideways_rejection_pre_event_matched_controls_v2.py' \
            -v
      - name: Verify all frozen source inputs exist
        run: |
          test -f reports/sideways_boundary_events_historical_v1/boundary_tests_historical_v1.csv
          for asset in BTC ETH SOL DOGE AVAX; do
            test -f "reports/sideways_detector_original_v1/${asset}_features_original_v1.csv"
            test -f "data/market_1m/${asset}_USDT_USDT_1m.csv"
          done

      - name: Run five-asset episode/retest anatomy study
        run: |
          python research/sideways_rejection_episode_retest_anatomy_v1.py \
            --events reports/sideways_boundary_events_historical_v1/boundary_tests_historical_v1.csv \
            --feature-dir reports/sideways_detector_original_v1 \
            --minute-dir data/market_1m \
            --output "$RUNNER_TEMP/sideways_rejection_episode_retest_anatomy_v1"

      - name: Run five-asset early-path sequence and post-landmark study
        run: |
          python research/sideways_rejection_early_path_sequence_followthrough_v1.py \
            --events reports/sideways_boundary_events_historical_v1/boundary_tests_historical_v1.csv \
            --feature-dir reports/sideways_detector_original_v1 \
            --minute-dir data/market_1m \
            --output "$RUNNER_TEMP/sideways_rejection_early_path_sequence_followthrough_v1"

      - name: Run reproducible sequence calendar block bootstrap
        run: |
          python research/sideways_rejection_sequence_block_bootstrap_v1.py \
            --sequence "$RUNNER_TEMP/sideways_rejection_early_path_sequence_followthrough_v1/event_sequence_v1.csv" \
            --outcomes "$RUNNER_TEMP/sideways_rejection_early_path_sequence_followthrough_v1/event_followthrough_v1.csv" \
            --output "$RUNNER_TEMP/sideways_rejection_sequence_block_bootstrap_v1" \
            --replicates 10000 \
            --seed 20261124

      - name: Run pre-event matched-control sensitivity study
        run: |
          python research/sideways_rejection_pre_event_matched_controls_v1.py \
            --anatomy "$RUNNER_TEMP/sideways_rejection_episode_retest_anatomy_v1/event_anatomy_v1.csv" \
            --sequence "$RUNNER_TEMP/sideways_rejection_early_path_sequence_followthrough_v1/event_sequence_v1.csv" \
            --outcomes "$RUNNER_TEMP/sideways_rejection_early_path_sequence_followthrough_v1/event_followthrough_v1.csv" \
            --feature-dir reports/sideways_detector_original_v1 \
            --minute-dir data/market_1m \
            --output "$RUNNER_TEMP/sideways_rejection_pre_event_matched_controls_v1" \
            --replicates 10000 \
            --seed 20261124

      - name: Run stricter pre-event matched-control sensitivity V2
        run: |
          python research/sideways_rejection_pre_event_matched_controls_v2.py \
            --anatomy "$RUNNER_TEMP/sideways_rejection_episode_retest_anatomy_v1/event_anatomy_v1.csv" \
            --sequence "$RUNNER_TEMP/sideways_rejection_early_path_sequence_followthrough_v1/event_sequence_v1.csv" \
            --outcomes "$RUNNER_TEMP/sideways_rejection_early_path_sequence_followthrough_v1/event_followthrough_v1.csv" \
            --feature-dir reports/sideways_detector_original_v1 \
            --minute-dir data/market_1m \
            --output "$RUNNER_TEMP/sideways_rejection_pre_event_matched_controls_v2" \
            --replicates 10000 \
            --seed 20261124 \
            --max-distance 1.5 \
            --max-abs-difference 0.75
      - name: Permanently archive Phase 3 research outputs in Git
        run: |
          archive="reports/sideways_phase3_research_archive_v1"
          mkdir -p "$archive/episode_retest_anatomy_v1" "$archive/early_path_followthrough_v1" "$archive/sequence_block_bootstrap_v1" "$archive/pre_event_matched_controls_v1" "$archive/pre_event_matched_controls_v2"
          cp -R "$RUNNER_TEMP/sideways_rejection_episode_retest_anatomy_v1/." "$archive/episode_retest_anatomy_v1/"
          cp -R "$RUNNER_TEMP/sideways_rejection_early_path_sequence_followthrough_v1/." "$archive/early_path_followthrough_v1/"
          cp -R "$RUNNER_TEMP/sideways_rejection_sequence_block_bootstrap_v1/." "$archive/sequence_block_bootstrap_v1/"
          cp -R "$RUNNER_TEMP/sideways_rejection_pre_event_matched_controls_v1/." "$archive/pre_event_matched_controls_v1/"
          cp -R "$RUNNER_TEMP/sideways_rejection_pre_event_matched_controls_v2/." "$archive/pre_event_matched_controls_v2/"
          cat > "$archive/README.md" <<'EOF'
          # Phase 3 sideways-regime research archive V1

          These are permanent, version-controlled outputs from the five-asset historical study.
          They are generated by the corresponding scripts in `research/` and use the frozen
          source datasets already stored in this repository.

          - `episode_retest_anatomy_v1/`: event anatomy, forward path outcomes, validation, summaries, metadata.
          - `early_path_followthrough_v1/`: sequence labels, post-landmark outcomes, validation, summaries, metadata.
          - `sequence_block_bootstrap_v1/`: calendar moving-block bootstrap contrasts and run metadata.
          - `pre_event_matched_controls_v1/`: initial 1:1 matched sensitivity; retained for audit, but covariate balance was insufficient for a conclusive comparison.
          - `pre_event_matched_controls_v2/`: stricter 1:1 matched sensitivity with both overall-distance and per-covariate calipers.

          The bootstrap contrasts are descriptive observational comparisons, not causal estimates
          or proof of a profitable trading strategy. The run metadata files record the study
          limitations and resampling settings.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$archive"
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Archive Phase 3 sideways research outputs V1"
            git push origin HEAD:price-action-v1
          fi
      - name: Upload stricter pre-event matched-control V2 outputs
        uses: actions/upload-artifact@v4
        with:
          name: sideways-rejection-pre-event-matched-controls-v2
          path: ${{ runner.temp }}/sideways_rejection_pre_event_matched_controls_v2/
          if-no-files-found: error
          retention-days: 14
      - name: Upload pre-event matched-control outputs
        uses: actions/upload-artifact@v4
        with:
          name: sideways-rejection-pre-event-matched-controls-v1
          path: ${{ runner.temp }}/sideways_rejection_pre_event_matched_controls_v1/
          if-no-files-found: error
          retention-days: 14

      - name: Upload calendar block bootstrap outputs
        uses: actions/upload-artifact@v4
        with:
          name: sideways-rejection-sequence-block-bootstrap-v1
          path: ${{ runner.temp }}/sideways_rejection_sequence_block_bootstrap_v1/
          if-no-files-found: error
          retention-days: 14

      - name: Upload episode/retest anatomy outputs
        uses: actions/upload-artifact@v4
        with:
          name: sideways-rejection-episode-retest-anatomy-v1
          path: ${{ runner.temp }}/sideways_rejection_episode_retest_anatomy_v1/
          if-no-files-found: error
          retention-days: 14

      - name: Upload early-path sequence follow-through outputs
        uses: actions/upload-artifact@v4
        with:
          name: sideways-rejection-early-path-sequence-followthrough-v1
          path: ${{ runner.temp }}/sideways_rejection_early_path_sequence_followthrough_v1/
          if-no-files-found: error
          retention-days: 14
