name: Phase 3 Rejection Lifecycle V1

on:
  workflow_dispatch:
  push:
    branches: [price-action-v1]
    paths:
      - research/phase3_rejection_lifecycle_v1.py
      - tests/test_phase3_rejection_lifecycle_v1.py
      - docs/research_checkpoints/2026-11-25_phase3_boundary_lifecycle_closure_protocol_v1.md
      - .github/workflows/phase3-rejection-lifecycle-v1.yml

permissions:
  contents: write

concurrency:
  group: phase3-rejection-lifecycle-v1
  cancel-in-progress: false

jobs:
  rejection-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out canonical research branch
        uses: actions/checkout@v4
        with:
          ref: price-action-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run synthetic lifecycle tests
        run: python -m unittest discover -s tests -p 'test_phase3_rejection_lifecycle_v1.py' -v

      - name: Run frozen historical rejection lifecycle
        run: python research/phase3_rejection_lifecycle_v1.py --output-dir reports/phase3_rejection_lifecycle_v1

      - name: Validate archived result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("reports/phase3_rejection_lifecycle_v1/run_metadata_v1.json")
          data = json.loads(p.read_text())
          assert data["eligible_events"] == 1992, data["eligible_events"]
          assert data["event_level_rows"] == 1992, data["event_level_rows"]
          assert data["horizon_rows"] == 7968, data["horizon_rows"]
          assert data["cohort_counts"] == {"broad": 1154, "strict": 838}
          assert set(data["market_source_gap_counts"].values()) == {0}, data["market_source_gap_counts"]
          print("Result contract PASS:", data["eligible_events"], "events;", data["episode_rows"], "episodes")
          PY

      - name: Upload immutable run artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase3-rejection-lifecycle-v1
          path: reports/phase3_rejection_lifecycle_v1/
          if-no-files-found: error
          retention-days: 90

      - name: Commit reproducible research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase3_rejection_lifecycle_v1/
          if ! git diff --cached --quiet; then
            git commit -m "Archive Phase 3 rejection lifecycle V1 results"
            git push origin HEAD:refs/heads/price-action-v1
          else
            echo "No report changes to commit."
          fi
