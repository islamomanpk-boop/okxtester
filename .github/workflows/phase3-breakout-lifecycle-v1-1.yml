name: Phase 3 Breakout Lifecycle V1.1
# Includes protocol regressions for strict/broad nesting and duplicate source identity.

on:
  workflow_dispatch:
  push:
    branches: [price-action-v1]
    paths:
      - research/phase3_breakout_lifecycle_v1_1.py
      - tests/test_phase3_breakout_lifecycle_v1_1.py
      - docs/research_checkpoints/2026-11-25_phase3_breakout_lifecycle_v1_1_amendment.md
      - .github/workflows/phase3-breakout-lifecycle-v1-1.yml

permissions:
  contents: write

concurrency:
  group: phase3-breakout-lifecycle-v1-1
  cancel-in-progress: false

jobs:
  breakout-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out canonical research branch
        uses: actions/checkout@v4
        with:
          ref: price-action-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned analysis dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3

      - name: Run synthetic breakout lifecycle tests
        run: python -m unittest discover -s tests -p 'test_phase3_breakout_lifecycle_v1_1.py' -v

      - name: Run frozen historical breakout lifecycle
        run: python research/phase3_breakout_lifecycle_v1_1.py --output-dir reports/phase3_breakout_lifecycle_v1_1

      - name: Validate archived result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("reports/phase3_breakout_lifecycle_v1_1/run_metadata_v1_1.json").read_text())
          assert data["primary_events"] == 1592, data["primary_events"]
          assert data["primary_links"] == 1537, data["primary_links"]
          assert data["events_with_zero_prior_touch_tests"] == 160
          assert data["horizon_rows"] == 6368, data["horizon_rows"]
          assert data["forward_crosscheck_rows"] == 6368
          assert data["forward_crosscheck_passed"] == 6368
          assert data["forward_crosscheck_fields_checked_per_row"] == 18
          assert data["forward_archive_unavailable_lifecycle_fields"] == [
              "outside_retest",
              "outside_retest_boundary_crossed",
              "outside_retest_minutes",
              "outside_retest_depth_pct_of_boundary",
              "outside_retest_hold",
          ]
          assert data["common_1m_timestamps"] == 569125
          assert data["common_1m_gaps"] == 0
          clusters = data["overlap_clusters"]
          assert clusters["total"] > 0
          assert sum(clusters["by_asset"].values()) == clusters["total"]
          assert clusters["largest_cluster_size"] > 0
          print("Result contract PASS:", data["primary_events"], "events;", data["horizon_rows"], "horizon rows;", clusters["total"], "overlap clusters")
          PY

      - name: Upload immutable breakout lifecycle artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase3-breakout-lifecycle-v1-1
          path: reports/phase3_breakout_lifecycle_v1_1/
          if-no-files-found: error
          retention-days: 90

      - name: Commit reproducible breakout lifecycle outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase3_breakout_lifecycle_v1_1/
          if ! git diff --cached --quiet; then
            git commit -m "Archive Phase 3 breakout lifecycle V1.1 results"
            git push origin HEAD:refs/heads/price-action-v1
          else
            echo "No report changes to commit."
          fi
