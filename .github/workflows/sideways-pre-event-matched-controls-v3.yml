name: Phase 3 Pre-event Matched-Control Sensitivity V3

on:
  workflow_dispatch:
  push:
    branches:
      - price-action-v1
    paths:
      - .github/workflows/sideways-pre-event-matched-controls-v3.yml

permissions:
  contents: write

concurrency:
  group: sideways-pre-event-matched-controls-v3
  cancel-in-progress: false

jobs:
  matched-control-study:
    name: Test, run, and archive stricter balanced matched-control sensitivity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out price-action-v1
        uses: actions/checkout@v4
        with:
          ref: price-action-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip numpy pandas

      - name: Compile V3 research module and tests
        run: |
          python -m py_compile \
            research/sideways_rejection_pre_event_matched_controls_v3.py \
            tests/test_sideways_rejection_pre_event_matched_controls_v3.py

      - name: Run V3 synthetic tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_sideways_rejection_pre_event_matched_controls_v3.py' \
            -v

      - name: Verify permanent Phase 3 source outputs and frozen inputs
        run: |
          test -f reports/sideways_phase3_research_archive_v1/episode_retest_anatomy_v1/event_anatomy_v1.csv
          test -f reports/sideways_phase3_research_archive_v1/early_path_followthrough_v1/event_sequence_v1.csv
          test -f reports/sideways_phase3_research_archive_v1/early_path_followthrough_v1/event_followthrough_v1.csv
          for asset in BTC ETH SOL DOGE AVAX; do
            test -f "reports/sideways_detector_original_v1/${asset}_features_original_v1.csv"
            test -f "data/market_1m/${asset}_USDT_USDT_1m.csv"
          done

      - name: Run V3 matched-control sensitivity study
        run: |
          python research/sideways_rejection_pre_event_matched_controls_v3.py \
            --anatomy reports/sideways_phase3_research_archive_v1/episode_retest_anatomy_v1/event_anatomy_v1.csv \
            --sequence reports/sideways_phase3_research_archive_v1/early_path_followthrough_v1/event_sequence_v1.csv \
            --outcomes reports/sideways_phase3_research_archive_v1/early_path_followthrough_v1/event_followthrough_v1.csv \
            --feature-dir reports/sideways_detector_original_v1 \
            --minute-dir data/market_1m \
            --output "$RUNNER_TEMP/sideways_rejection_pre_event_matched_controls_v3" \
            --replicates 10000 \
            --seed 20261124 \
            --max-distance 2.0 \
            --max-abs-difference 1.25

      - name: Permanently archive V3 results in Git
        run: |
          archive="reports/sideways_phase3_research_archive_v1/pre_event_matched_controls_v3"
          mkdir -p "$archive"
          cp -R "$RUNNER_TEMP/sideways_rejection_pre_event_matched_controls_v3/." "$archive/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$archive"
          if git diff --cached --quiet; then
            echo "No V3 archive changes to commit."
          else
            git commit -m "Archive Phase 3 matched-control sensitivity V3"
            git push origin HEAD:price-action-v1
          fi

      - name: Upload V3 matched-control results
        uses: actions/upload-artifact@v4
        with:
          name: sideways-rejection-pre-event-matched-controls-v3
          path: ${{ runner.temp }}/sideways_rejection_pre_event_matched_controls_v3/
          if-no-files-found: error
          retention-days: 14
