name: Funding and Execution Engine Contract Tests

on:
  push:
    branches: [price-action-v1]
    paths:
      - src/execution_engine.py
      - src/portfolio_backtester.py
      - src/funding_coverage.py
      - src/test_execution_engine.py
      - src/test_portfolio_backtester.py
      - src/test_experiment_portfolio.py
      - src/test_trailing_portfolio.py
      - src/test_portfolio_engine.py
      - src/test_portfolio_safety.py
      - .github/workflows/funding-engine-contract-tests.yml

permissions:
  contents: read

concurrency:
  group: funding-engine-contract-tests
  cancel-in-progress: false

jobs:
  engine-tests:
    name: Compile and run funding/execution engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out price-action-v1
        uses: actions/checkout@v4
        with:
          ref: price-action-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas

      - name: Compile execution engines and focused tests
        run: |
          python -m py_compile \
            src/execution_engine.py \
            src/portfolio_backtester.py \
            src/test_execution_engine.py \
            src/test_portfolio_backtester.py \
            src/test_experiment_portfolio.py \
            src/test_trailing_portfolio.py \
            src/test_portfolio_engine.py \
            src/test_portfolio_safety.py

      - name: Run standalone execution engine tests
        run: python -m unittest discover -s src -p 'test_execution_engine.py' -v

      - name: Run portfolio backtester tests
        run: python -m unittest discover -s src -p 'test_portfolio_backtester.py' -v

      - name: Run portfolio experiment integration tests
        run: python -m unittest discover -s src -p 'test_experiment_portfolio.py' -v

      - name: Run trailing portfolio integration tests
        run: python -m unittest discover -s src -p 'test_trailing_portfolio.py' -v

      - name: Run portfolio allocator and safety tests
        run: |
          python -m unittest discover -s src -p 'test_portfolio_engine.py' -v
          python -m unittest discover -s src -p 'test_portfolio_safety.py' -v
