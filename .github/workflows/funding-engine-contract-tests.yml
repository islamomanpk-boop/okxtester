name: Funding and Execution Engine Contract Tests
on:
  push:
    branches: [price-action-v1]
    paths:
      - src/execution_engine.py
      - src/portfolio_backtester.py
      - src/funding_coverage.py
      - src/test_funding_coverage.py
      - src/test_funding_loader.py
      - src/test_funding_engine_parity.py
      - src/audit_funding_contract_integration.py
      - src/test_funding_contract_integration.py
      - src/test_execution_engine.py
      - src/test_portfolio_backtester.py
      - src/test_experiment_portfolio.py
      - src/test_trailing_portfolio.py
      - src/test_portfolio_engine.py
      - src/test_portfolio_safety.py
      - src/run_exit_experiments.py
      - src/run_cost_sensitivity.py
      - src/run_exit_experiment_batch.py
      - src/verify_local_funding_manifest.py
      - src/inspect_okx_mark_price_history.py
      - src/phase3_funding_mark_price_full_coverage_v1.py
      - src/test_phase3_funding_mark_price_full_coverage_v1.py
      - src/audit_stop_gap_risk.py
      - src/test_stop_gap_risk_audit.py
      - data/market_1m/**
      - research/inspect_okx_demo_readonly_api.py
      - .github/workflows/funding-engine-contract-tests.yml
permissions:
  contents: read
concurrency:
  group: funding-engine-contract-tests
  cancel-in-progress: false
jobs:
  engine-tests:
    name: Compile, test, and audit historical stop-gap risk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out price-action-v1
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
      - name: Compile execution engines and focused tests
        run: |
          python -m py_compile \
            src/funding_coverage.py src/test_funding_coverage.py \
            src/test_funding_loader.py src/execution_engine.py \
            src/portfolio_backtester.py src/test_execution_engine.py \
            src/test_portfolio_backtester.py src/test_experiment_portfolio.py \
            src/test_trailing_portfolio.py src/test_portfolio_engine.py \
            src/test_portfolio_safety.py src/run_exit_experiments.py \
            src/run_cost_sensitivity.py src/run_exit_experiment_batch.py \
            src/verify_local_funding_manifest.py src/inspect_okx_mark_price_history.py \
            src/phase3_funding_mark_price_full_coverage_v1.py \
            src/test_phase3_funding_mark_price_full_coverage_v1.py \
            src/audit_stop_gap_risk.py src/test_stop_gap_risk_audit.py \
            research/inspect_okx_demo_readonly_api.py
      - name: Run historical stop-gap audit unit tests
        run: python -m unittest discover -s src -p 'test_stop_gap_risk_audit.py' -v
      - name: Run historical one-minute OHLC stop-gap audit
        run: |
          python src/audit_stop_gap_risk.py \
            --data-dir data/market_1m \
            --output reports/g0_07_stop_gap_risk_audit_v1.json
      - name: Upload historical stop-gap audit report
        uses: actions/upload-artifact@v4
        with:
          name: g0-07-stop-gap-risk-audit-v1
          path: reports/g0_07_stop_gap_risk_audit_v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Run full-window mark-price audit helper tests
        run: python -m unittest discover -s src -p 'test_phase3_funding_mark_price_full_coverage_v1.py' -v
      - name: Run funding coverage contract tests
        run: python -m unittest discover -s src -p 'test_funding_coverage.py' -v
      - name: Run funding manifest loader tests
        run: python -m unittest discover -s src -p 'test_funding_loader.py' -v
      - name: Run read-only funding contract integration tests
        run: python -m unittest discover -s src -p 'test_funding_contract_integration.py' -v
      - name: Run standalone/portfolio funding arithmetic parity tests
        run: python -m unittest discover -s src -p 'test_funding_engine_parity.py' -v
      - name: Run standalone execution engine tests
        run: python -m unittest discover -s src -p 'test_execution_engine.py' -v
      - name: Run portfolio backtester tests
        run: python -m unittest discover -s src -p 'test_portfolio_backtester.py' -v
      - name: Run portfolio experiment integration tests
        run: python -m unittest discover -s src -p 'test_experiment_portfolio.py' -v
      - name: Run trailing portfolio integration tests
        run: python -m unittest discover -s src -p 'test_trailing_portfolio.py' -v
      - name: Run portfolio allocator and safety tests
        run: |
          python -m unittest discover -s src -p 'test_portfolio_engine.py' -v
          python -m unittest discover -s src -p 'test_portfolio_safety.py' -v
