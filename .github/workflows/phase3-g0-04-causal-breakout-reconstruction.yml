name: Phase 3 G0-04 Causal Breakout Reconstruction

on:
  workflow_dispatch:
  push:
    branches:
      - price-action-v1
    paths:
      - research/phase3_g0_04_causal_breakout_reconstruction_v1.py
      - .github/workflows/phase3-g0-04-causal-breakout-reconstruction.yml

permissions:
  contents: read

concurrency:
  group: phase3-g0-04-causal-reconstruction
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: price-action-v1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3

      - name: Compile and run synthetic contract tests
        run: |
          python -m py_compile research/phase3_g0_04_causal_breakout_reconstruction_v1.py
          python research/phase3_g0_04_causal_breakout_reconstruction_v1.py --self-test

      - name: Run fail-closed descriptive reconstruction
        run: |
          python research/phase3_g0_04_causal_breakout_reconstruction_v1.py \
            --repo-root . \
            --output-dir phase3_g0_04_output

      - name: Upload descriptive artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-g0-04-causal-reconstruction-${{ github.run_id }}
          path: phase3_g0_04_output/
          if-no-files-found: warn
          retention-days: 14
