name: Sideways Rejection V1 - Read-Only Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sideways-rejection-v1-read-only
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Syntax and focused unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out price-action-v1
        uses: actions/checkout@v4
        with:
          ref: price-action-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas

      - name: Compile the research module and its test
        run: |
          python -m py_compile \
            research/sideways_rejection_forward_outcomes_v1.py \
            tests/test_sideways_rejection_forward_outcomes_v1.py \\
            research/sideways_rejection_episode_retest_anatomy_v1.py \\
            tests/test_sideways_rejection_episode_retest_anatomy_v1.py

      - name: Run existing rejection forward-outcome tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_sideways_rejection_forward_outcomes_v1.py' \
            -v

      - name: Run new episode/retest anatomy synthetic tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_sideways_rejection_episode_retest_anatomy_v1.py' \
            -v
