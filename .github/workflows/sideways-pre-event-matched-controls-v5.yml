name: Phase 3 Outcome-Blind Matched-Control Caliper Sensitivity V5

on:
  workflow_dispatch:
  push:
    branches: [price-action-v1]
    paths:
      - .github/workflows/sideways-pre-event-matched-controls-v5.yml

permissions:
  contents: write

concurrency:
  group: sideways-pre-event-matched-controls-v5
  cancel-in-progress: false

jobs:
  caliper-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: price-action-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Compile and test V5
        run: |
          python -m py_compile research/sideways_rejection_pre_event_matched_controls_v4.py research/sideways_rejection_pre_event_matched_controls_v5.py tests/test_sideways_rejection_pre_event_matched_controls_v5.py
          python -m unittest discover -s tests -p 'test_sideways_rejection_pre_event_matched_controls_v5.py' -v
      - name: Verify frozen Phase 3 inputs
        run: |
          test -f reports/sideways_phase3_research_archive_v1/episode_retest_anatomy_v1/event_anatomy_v1.csv
          test -f reports/sideways_phase3_research_archive_v1/early_path_followthrough_v1/event_sequence_v1.csv
          for asset in BTC ETH SOL DOGE AVAX; do
            test -f "reports/sideways_detector_original_v1/${asset}_features_original_v1.csv"
            test -f "data/market_1m/${asset}_USDT_USDT_1m.csv"
          done
      - name: Run outcome-blind caliper grid
        run: |
          python research/sideways_rejection_pre_event_matched_controls_v5.py \
            --anatomy reports/sideways_phase3_research_archive_v1/episode_retest_anatomy_v1/event_anatomy_v1.csv \
            --sequence reports/sideways_phase3_research_archive_v1/early_path_followthrough_v1/event_sequence_v1.csv \
            --feature-dir reports/sideways_detector_original_v1 \
            --minute-dir data/market_1m \
            --output "$RUNNER_TEMP/sideways_pre_event_matched_controls_v5"
      - name: Permanently archive V5 sensitivity results
        run: |
          archive=reports/sideways_phase3_research_archive_v1/pre_event_matched_controls_v5
          mkdir -p "$archive"
          cp -R "$RUNNER_TEMP/sideways_pre_event_matched_controls_v5/." "$archive/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$archive"
          if git diff --cached --quiet; then
            echo "No V5 archive changes."
          else
            git commit -m "Archive Phase 3 outcome-blind matching caliper sensitivity V5"
            git push origin HEAD:price-action-v1
          fi
      - name: Upload secondary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sideways-pre-event-matched-controls-v5
          path: ${{ runner.temp }}/sideways_pre_event_matched_controls_v5/
          if-no-files-found: error
          retention-days: 14
