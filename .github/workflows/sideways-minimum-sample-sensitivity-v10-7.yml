name: Phase 3 V10.7 Minimum Subgroup-Size Sensitivity
on:
  workflow_dispatch:
  push:
    branches: [price-action-v1]
    paths:
      - .github/workflows/sideways-minimum-sample-sensitivity-v10-7.yml
      - research/sideways_rejection_pre_event_matched_controls_v10_7.py
      - tests/test_sideways_rejection_pre_event_matched_controls_v10_7.py
permissions:
  contents: write
concurrency:
  group: sideways-minimum-sample-sensitivity-v10-7
  cancel-in-progress: false
jobs:
  audit-v10-7:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: price-action-v1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas
      - name: Compile and test
        run: |
          python -m py_compile research/sideways_rejection_pre_event_matched_controls_v10_7.py tests/test_sideways_rejection_pre_event_matched_controls_v10_7.py
          python -m unittest discover -s tests -p 'test_sideways_rejection_pre_event_matched_controls_v10_7.py' -v
      - name: Verify frozen V10.5 input and V10.6 archive
        run: |
          test -s reports/sideways_phase3_research_archive_v1/asset_direction_balance_attribution_v10_5/asset_direction_covariate_balance_v10_5.csv
          test -s reports/sideways_phase3_research_archive_v1/stable_stratum_balance_synthesis_v10_6/design_level_balance_synthesis_v10_6.csv
      - name: Run subgroup-size sensitivity
        run: |
          python research/sideways_rejection_pre_event_matched_controls_v10_7.py \
            --input reports/sideways_phase3_research_archive_v1/asset_direction_balance_attribution_v10_5/asset_direction_covariate_balance_v10_5.csv \
            --output "$RUNNER_TEMP/sideways_minimum_sample_sensitivity_v10_7"
      - name: Permanently archive with retry-safe push
        run: |
          archive=reports/sideways_phase3_research_archive_v1/minimum_subgroup_size_sensitivity_v10_7
          mkdir -p "$archive"
          cp -R "$RUNNER_TEMP/sideways_minimum_sample_sensitivity_v10_7/." "$archive/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$archive"
          if ! git diff --cached --quiet; then
            git commit -m "Archive Phase 3 V10.7 subgroup-size sensitivity"
            for attempt in 1 2 3; do
              git pull --rebase origin price-action-v1
              if git push origin HEAD:price-action-v1; then exit 0; fi
              sleep 2
            done
            echo "Archive push failed after retries" >&2
            exit 1
          fi
      - name: Upload secondary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sideways-minimum-sample-sensitivity-v10-7
          path: ${{ runner.temp }}/sideways_minimum_sample_sensitivity_v10_7/
          if-no-files-found: error
          retention-days: 14
