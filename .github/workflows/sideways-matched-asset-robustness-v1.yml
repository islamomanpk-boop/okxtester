name: Phase 3 Matched-Pair Asset Robustness V1

on:
  workflow_dispatch:
  push:
    branches:
      - price-action-v1
    paths:
      - .github/workflows/sideways-matched-asset-robustness-v1.yml

permissions:
  contents: write

concurrency:
  group: sideways-matched-asset-robustness-v1
  cancel-in-progress: false

jobs:
  asset-robustness:
    name: Test, run, and archive matched-pair asset robustness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out price-action-v1
        uses: actions/checkout@v4
        with:
          ref: price-action-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip numpy pandas

      - name: Compile asset robustness module and tests
        run: |
          python -m py_compile \
            research/sideways_rejection_matched_asset_robustness_v1.py \
            tests/test_sideways_rejection_matched_asset_robustness_v1.py

      - name: Run asset robustness synthetic tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_sideways_rejection_matched_asset_robustness_v1.py' \
            -v

      - name: Verify permanent matched-pair and outcome inputs
        run: |
          test -f reports/sideways_phase3_research_archive_v1/pre_event_matched_controls_v4/matched_pairs_v4.csv
          test -f reports/sideways_phase3_research_archive_v1/early_path_followthrough_v1/event_followthrough_v1.csv

      - name: Run asset-level and leave-one-asset-out robustness
        run: |
          python research/sideways_rejection_matched_asset_robustness_v1.py \
            --pairs reports/sideways_phase3_research_archive_v1/pre_event_matched_controls_v4/matched_pairs_v4.csv \
            --outcomes reports/sideways_phase3_research_archive_v1/early_path_followthrough_v1/event_followthrough_v1.csv \
            --output "$RUNNER_TEMP/sideways_rejection_matched_asset_robustness_v1" \
            --replicates 10000 \
            --seed 20261124

      - name: Permanently archive asset robustness results in Git
        run: |
          archive="reports/sideways_phase3_research_archive_v1/asset_robustness_v1"
          mkdir -p "$archive"
          cp -R "$RUNNER_TEMP/sideways_rejection_matched_asset_robustness_v1/." "$archive/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$archive"
          if git diff --cached --quiet; then
            echo "No asset robustness archive changes to commit."
          else
            git commit -m "Archive Phase 3 matched asset robustness results V1"
            git push origin HEAD:price-action-v1
          fi

      - name: Upload asset robustness outputs
        uses: actions/upload-artifact@v4
        with:
          name: sideways-matched-asset-robustness-v1
          path: ${{ runner.temp }}/sideways_rejection_matched_asset_robustness_v1/
          if-no-files-found: error
          retention-days: 14
