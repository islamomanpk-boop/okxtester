name: Sideways Boundary Interaction and Penetration Taxonomy V1 - Historical Study

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sideways-boundary-interaction-taxonomy-v1
  cancel-in-progress: false

jobs:
  historical-study:
    name: Validate sources, test taxonomy, and run five-asset study
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out price-action-v1
        uses: actions/checkout@v4
        with:
          ref: price-action-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas

      - name: Compile taxonomy module and tests
        run: |
          python -m py_compile \
            research/sideways_boundary_interaction_taxonomy/sideways_boundary_interaction_taxonomy_v1.py \
            tests/test_sideways_boundary_interaction_taxonomy_v1.py

      - name: Run taxonomy synthetic tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_sideways_boundary_interaction_taxonomy_v1.py' \
            -v

      - name: Verify frozen one-minute source inputs
        run: |
          set -euo pipefail
          for asset in BTC ETH SOL DOGE AVAX; do
            file="data/market_1m/${asset}_USDT_USDT_1m.csv"
            test -s "$file"
            test "$(head -n 1 "$file")" = "ts,open,high,low,close,vol"
          done

      - name: Reconstruct frozen 15-minute source bars
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/market_15m"
          python - <<'PY'
          from pathlib import Path
          import os
          import pandas as pd

          root = Path("data/market_1m")
          out = Path(os.environ["RUNNER_TEMP"]) / "market_15m"
          assets = ["BTC", "ETH", "SOL", "DOGE", "AVAX"]
          interval_ms = 15 * 60 * 1000

          for asset in assets:
              source = root / f"{asset}_USDT_USDT_1m.csv"
              df = pd.read_csv(source)
              required = ["ts", "open", "high", "low", "close", "vol"]
              if list(df.columns) != required:
                  raise ValueError(f"{asset}: unexpected 1M source columns")
              df["ts"] = pd.to_numeric(df["ts"], errors="raise").astype("int64")
              if df["ts"].duplicated().any() or not df["ts"].is_monotonic_increasing:
                  raise ValueError(f"{asset}: duplicate or unordered 1M timestamps")
              if not (df["ts"].diff().dropna() == 60_000).all():
                  raise ValueError(f"{asset}: 1M source cadence is not continuous")
              bucket = (df["ts"] // interval_ms) * interval_ms
              grouped = df.assign(bucket=bucket).groupby("bucket", sort=True)
              bars = grouped.agg(
                  open=("open", "first"),
                  high=("high", "max"),
                  low=("low", "min"),
                  close=("close", "last"),
                  vol=("vol", "sum"),
                  minute_count=("ts", "size"),
              )
              # Keep only complete, epoch-aligned 15-minute candles.
              bars = bars.loc[bars["minute_count"] == 15].drop(columns="minute_count")
              bars.index.name = "ts"
              if len(bars) != 37_941:
                  raise ValueError(
                      f"{asset}: expected 37,941 complete 15M bars, got {len(bars)}"
                  )
              bars.to_csv(out / f"{asset}_USDT_15m.csv", index=True)
              print(f"{asset}: reconstructed {len(bars):,} complete 15M bars")
          PY

      - name: Verify frozen 15-minute hashes and run historical taxonomy
        run: |
          python research/sideways_boundary_interaction_taxonomy/sideways_boundary_interaction_taxonomy_v1.py \
            --data-dir "$RUNNER_TEMP/market_15m" \
            --feature-dir reports/sideways_detector_original_v1 \
            --output-dir "$RUNNER_TEMP/sideways_boundary_interaction_taxonomy_v1"

      - name: Upload historical taxonomy outputs
        uses: actions/upload-artifact@v4
        with:
          name: sideways-boundary-interaction-taxonomy-v1
          path: ${{ runner.temp }}/sideways_boundary_interaction_taxonomy_v1/
          if-no-files-found: error
          retention-days: 14
