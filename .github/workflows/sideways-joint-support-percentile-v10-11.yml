name: Phase 3 V10.11 Joint Support Percentile Sensitivity
on:
  workflow_dispatch:
  push:
    branches: [price-action-v1]
    paths:
      - .github/workflows/sideways-joint-support-percentile-v10-11.yml
      - research/sideways_rejection_pre_event_matched_controls_v10_11.py
      - tests/test_sideways_rejection_pre_event_matched_controls_v10_11.py
permissions:
  contents: write
concurrency:
  group: sideways-joint-support-percentile-v10-11
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: price-action-v1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy
      - name: Compile and test
        run: |
          python -m py_compile research/sideways_rejection_pre_event_matched_controls_v4.py research/sideways_rejection_pre_event_matched_controls_v10_11.py tests/test_sideways_rejection_pre_event_matched_controls_v10_11.py
          python -m unittest discover -s tests -p 'test_sideways_rejection_pre_event_matched_controls_v10_11.py' -v
      - name: Verify frozen inputs
        run: |
          test -s reports/sideways_phase3_research_archive_v1/episode_retest_anatomy_v1/event_anatomy_v1.csv
          test -s reports/sideways_phase3_research_archive_v1/early_path_followthrough_v1/event_sequence_v1.csv
          test -s reports/sideways_phase3_research_archive_v1/pre_event_matched_controls_v6/optimal_matched_pairs_v6.csv
          for asset in BTC ETH SOL DOGE AVAX; do
            test -s "reports/sideways_detector_original_v1/${asset}_features_original_v1.csv"
            test -s "data/market_1m/${asset}_USDT_USDT_1m.csv"
          done
      - name: Run outcome-blind V10.11
        run: |
          python research/sideways_rejection_pre_event_matched_controls_v10_11.py \
            --anatomy reports/sideways_phase3_research_archive_v1/episode_retest_anatomy_v1/event_anatomy_v1.csv \
            --sequence reports/sideways_phase3_research_archive_v1/early_path_followthrough_v1/event_sequence_v1.csv \
            --feature-dir reports/sideways_detector_original_v1 \
            --minute-dir data/market_1m \
            --pairs reports/sideways_phase3_research_archive_v1/pre_event_matched_controls_v6/optimal_matched_pairs_v6.csv \
            --output "$RUNNER_TEMP/sideways_joint_support_v10_11"
      - name: Permanently archive
        run: |
          archive=reports/sideways_phase3_research_archive_v1/joint_common_support_percentile_sensitivity_v10_11
          mkdir -p "$archive"
          cp -R "$RUNNER_TEMP/sideways_joint_support_v10_11/." "$archive/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$archive"
          if ! git diff --cached --quiet; then
            git commit -m "Archive Phase 3 V10.11 joint support percentile sensitivity"
            for attempt in 1 2 3; do
              git pull --rebase origin price-action-v1
              if git push origin HEAD:price-action-v1; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Upload secondary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sideways-joint-support-v10-11
          path: ${{ runner.temp }}/sideways_joint_support_v10_11/
          if-no-files-found: error
          retention-days: 14
