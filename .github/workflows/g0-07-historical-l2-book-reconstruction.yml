name: G0-07 Historical L2 Book Reconstruction Sample
on:
  push:
    branches: [price-action-v1]
    paths:
      - src/reconstruct_okx_historical_l2_book.py
      - src/test_reconstruct_okx_historical_l2_book.py
      - .github/workflows/g0-07-historical-l2-book-reconstruction.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g0-07-historical-l2-book-reconstruction
  cancel-in-progress: true
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile reconstruction and tests
        run: python -m py_compile src/reconstruct_okx_historical_l2_book.py src/test_reconstruct_okx_historical_l2_book.py
      - name: Run reconstruction unit tests
        run: python -m unittest discover -s src -p 'test_reconstruct_okx_historical_l2_book.py' -v
      - name: Reconstruct five asset L2 archives in memory
        run: python src/reconstruct_okx_historical_l2_book.py
      - name: Upload compact book statistics
        uses: actions/upload-artifact@v4
        with:
          name: g0-07-historical-l2-book-reconstruction-v1
          path: reports/g0_07_historical_l2_book_reconstruction_v1.json
          if-no-files-found: error
          retention-days: 30
