name: Phase 3 V10.5 Asset-Direction Balance Attribution
on:
  workflow_dispatch:
  push:
    branches: [price-action-v1]
    paths:
      - .github/workflows/sideways-asset-direction-balance-v10-5.yml
      - research/sideways_rejection_pre_event_matched_controls_v10_5.py
      - tests/test_sideways_rejection_pre_event_matched_controls_v10_5.py
permissions:
  contents: write
concurrency:
  group: sideways-asset-direction-balance-v10-5
  cancel-in-progress: false
jobs:
  audit-v10-5:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: price-action-v1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy
      - name: Compile and test
        run: |
          python -m py_compile research/sideways_rejection_pre_event_matched_controls_v4.py research/sideways_rejection_pre_event_matched_controls_v5.py research/sideways_rejection_pre_event_matched_controls_v6.py research/sideways_rejection_pre_event_matched_controls_v10_4.py research/sideways_rejection_pre_event_matched_controls_v10_5.py tests/test_sideways_rejection_pre_event_matched_controls_v10_5.py
          python -m unittest discover -s tests -p 'test_sideways_rejection_pre_event_matched_controls_v10_5.py' -v
      - name: Verify frozen inputs
        run: |
          test -f reports/sideways_phase3_research_archive_v1/episode_retest_anatomy_v1/event_anatomy_v1.csv
          test -f reports/sideways_phase3_research_archive_v1/early_path_followthrough_v1/event_sequence_v1.csv
          for asset in BTC ETH SOL DOGE AVAX; do
            test -f "reports/sideways_detector_original_v1/${asset}_features_original_v1.csv"
            test -f "data/market_1m/${asset}_USDT_USDT_1m.csv"
          done
      - name: Run outcome-blind subgroup attribution
        run: |
          python research/sideways_rejection_pre_event_matched_controls_v10_5.py \
            --anatomy reports/sideways_phase3_research_archive_v1/episode_retest_anatomy_v1/event_anatomy_v1.csv \
            --sequence reports/sideways_phase3_research_archive_v1/early_path_followthrough_v1/event_sequence_v1.csv \
            --feature-dir reports/sideways_detector_original_v1 \
            --minute-dir data/market_1m \
            --output "$RUNNER_TEMP/sideways_asset_direction_balance_v10_5"
      - name: Permanently archive
        run: |
          archive=reports/sideways_phase3_research_archive_v1/asset_direction_balance_attribution_v10_5
          mkdir -p "$archive"
          cp -R "$RUNNER_TEMP/sideways_asset_direction_balance_v10_5/." "$archive/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$archive"
          if git diff --cached --quiet; then echo "No archive changes"; else
            git commit -m "Archive Phase 3 V10.5 asset-direction balance attribution"
            git push origin HEAD:price-action-v1
          fi
      - name: Upload secondary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sideways-asset-direction-balance-v10-5
          path: ${{ runner.temp }}/sideways_asset_direction_balance_v10_5/
          if-no-files-found: error
          retention-days: 14
