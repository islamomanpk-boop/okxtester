name: Phase 3 G0-05 Read-Only Source Audit

on:
  workflow_dispatch:
  push:
    branches:
      - price-action-v1
    paths:
      - research/phase3_g0_05_source_manifest_audit_v1.py
      - research/phase3_g0_05_independent_source_verification_v1.py
      - .github/workflows/phase3-g0-05-source-audit.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: phase3-g0-05-source-audit
  cancel-in-progress: false

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: price-action-v1
          persist-credentials: false

      - name: Download and verify frozen G0-04 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifact_id=15087542445
          source_run_id=45756061179
          artifact_name="phase3-g0-04-causal-reconstruction-45756061179"

          # Confirm the exact pinned artifact still exists, has the expected name,
          # and has not expired before downloading it.
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/artifacts?per_page=100" \
            --jq "[.artifacts[] | select(.id == ${artifact_id} and .name == \"${artifact_name}\" and .expired == false)] | length == 1" \
            | grep -qx true

          # Read the expected digest from the audited source file so the workflow
          # cannot silently drift from the provenance pin.
          expected_sha256="$(python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("research/phase3_g0_05_source_manifest_audit_v1.py").read_text())
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == "G004_ZIP_SHA256"
                  for target in node.targets
              ):
                  print(ast.literal_eval(node.value))
                  break
          else:
              raise SystemExit("G004_ZIP_SHA256 is not defined as a literal")
          PY
          )"
          [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]

          curl --fail --location --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output g004_artifact.zip

          printf '%s  %s\n' "$expected_sha256" "g004_artifact.zip" | sha256sum --check -
          mkdir -p g004_artifact
          unzip -q g004_artifact.zip -d g004_artifact
          rm g004_artifact.zip

      - name: Compile source audit
        run: python -m py_compile research/phase3_g0_05_source_manifest_audit_v1.py

      - name: Run read-only provenance and identity audit
        run: |
          python research/phase3_g0_05_source_manifest_audit_v1.py \
            --repo-root . \
            --g004-artifact-dir g004_artifact \
            --output-dir g0_05_source_audit_output

      - name: Compile independent source verifier
        run: python -m py_compile research/phase3_g0_05_independent_source_verification_v1.py

      - name: Run independent source identity and lifecycle verification
        run: |
          python research/phase3_g0_05_independent_source_verification_v1.py \\
            --repo-root . \\
            --artifact-dir g004_artifact \\
            --audit-dir g0_05_source_audit_output \\
            --output g0_05_source_audit_output/independent_source_verification.json

      - name: Upload source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-g0-05-source-audit-${{ github.run_id }}
          path: g0_05_source_audit_output/
          if-no-files-found: warn
          retention-days: 14
